name: fetch
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p data
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL --max-time 60 -A "$UA" "https://youtubetranscribe.khabaroff.studio/transcript/B1KJXLW7pKE?auto=true&timestamps=false" -o data/khab.txt
          curl -sSL --max-time 60 -A "$UA" "https://yt-transcript.net/B1KJXLW7pKE?fmt=json" -o data/ytt_net.json
          curl -sSL --max-time 60 -A "$UA" "https://api.webpeel.dev/v1/youtube?url=https://www.youtube.com/watch?v=B1KJXLW7pKE&language=hi" -o data/webpeel.json
          curl -sSL --max-time 60 -A "$UA" -X POST -H "Content-Type: application/json" -d '{"url":"https://www.youtube.com/watch?v=B1KJXLW7pKE","lang":"hi"}' "https://transcribeyoutube.com/api/transcript" -o data/transcribeyt.json
          curl -sSL --max-time 60 -A "$UA" -X POST -H "Content-Type: application/json" -d '{"video_id":"B1KJXLW7pKE","format":true}' "https://api.kome.ai/api/tools/youtube-transcripts" -o data/kome.json
          curl -sSL --max-time 60 -A "$UA" "https://filmot.com/video/B1KJXLW7pKE" -o data/filmot.html
          curl -sSL --max-time 60 -A "$UA" "https://tactiq-apps-prod.tactiq.io/transcript" -X POST -H "Content-Type: application/json" -d '{"videoUrl":"https://www.youtube.com/watch?v=B1KJXLW7pKE","langCode":"hi"}' -o data/tactiq.json
          curl -sSL --max-time 60 -A "$UA" "https://youtubetotranscript.com/transcript?v=B1KJXLW7pKE" -o data/ytt2.html
          ls -la data
          wc -c data/*
      - name: commit
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "fetch-bot"
          git add -A
          git commit -m "fetch data 3" || echo "nothing to commit"
          git push
