name: fetch
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: fetch
        run: |
          mkdir -p data
          set +e
          curl -sSL --max-time 90 "https://r.jina.ai/https://youtubetotranscript.com/transcript?v=B1KJXLW7pKE" -o data/jina_ytt.txt
          curl -sSL --max-time 90 "https://r.jina.ai/https://www.youtube.com/watch?v=B1KJXLW7pKE" -o data/jina_yt.txt
          curl -sSL --max-time 90 "https://r.jina.ai/https://youtubetranscript.com/?v=B1KJXLW7pKE" -o data/jina_ytcom.txt
          curl -sSL --max-time 90 -H "X-Return-Format: text" "https://r.jina.ai/https://inv.nadeko.net/api/v1/captions/B1KJXLW7pKE?label=Hindi%20(auto-generated)" -o data/jina_vtt.txt
          npx -y get-youtube-transcript B1KJXLW7pKE --lang hi --format json > data/gytt.json 2> data/gytt.log
          npx -y @nadimtuhin/ytranscript get B1KJXLW7pKE --lang hi --format json > data/ytr.json 2> data/ytr.log
          ls -la data
          wc -c data/*
      - name: commit
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "fetch-bot"
          git add -A
          git commit -m "fetch data 2" || echo "nothing to commit"
          git push
